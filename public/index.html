<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Incident Manager</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Security Incident Report Manager</h1><p>Record and track security incidents</p></header><main><section class="card"><h2>New incident</h2><form id="form"><input id="title" required maxlength="100" placeholder="Incident title"><textarea id="description" required maxlength="1000" placeholder="Describe what happened"></textarea><select id="severity"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select><button>Submit incident</button></form><p id="msg" class="muted"></p></section><section class="card"><h2>Incident reports</h2><div id="list">Loading...</div></section></main><script src="app.js"></script></body></html>
